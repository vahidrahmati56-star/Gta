<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12002b">
<title>همه چیز بلد</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:Tahoma,'Segoe UI',sans-serif;background:#000;color:#fff;touch-action:none;overscroll-behavior:none}
canvas{display:block;touch-action:none}

/* ============ MENU ============ */
#menu{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%, #3b0a5e 0%, #12002b 60%, #05000f 100%);overflow:hidden;padding:20px}
#menu::before{content:'';position:absolute;inset:-50%;
  background:conic-gradient(from 0deg, transparent, rgba(255,180,60,.09), transparent 30%);
  animation:spin 20s linear infinite}
#menu::after{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 20% 80%, rgba(255,90,60,.15), transparent 40%),
             radial-gradient(circle at 80% 20%, rgba(90,200,255,.12), transparent 40%);pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.menu-inner{position:relative;z-index:2;text-align:center;padding:20px;width:100%;max-width:420px}
.title{font-size:clamp(38px,12vw,80px);font-weight:900;letter-spacing:1px;
  background:linear-gradient(90deg,#ffd76e,#ff8a3d,#ffd76e,#ff8a3d,#ffd76e);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 4s linear infinite, float 3s ease-in-out infinite;line-height:1.1}
@keyframes shine{to{background-position:200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.subtitle{margin-top:8px;font-size:clamp(13px,3.6vw,20px);color:#c8a8ff;letter-spacing:4px;opacity:.9}
.btns{margin-top:36px;display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.btn{width:100%;max-width:340px;padding:16px 24px;font-size:clamp(15px,4.2vw,19px);font-weight:700;font-family:inherit;cursor:pointer;
  border:2px solid rgba(255,190,80,.55);border-radius:14px;color:#ffe9b8;
  background:linear-gradient(180deg,rgba(90,20,140,.75),rgba(40,5,70,.9));
  transition:.2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.96);border-color:#ffd76e}
.foot{margin-top:30px;font-size:11px;color:#8a7aa8;letter-spacing:2px}
.hidden{display:none!important}

/* ============ HUD ============ */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#clock{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;background:rgba(10,5,25,.78);border:1.5px solid rgba(255,190,80,.5);
  border-radius:12px;padding:6px 12px;text-align:center;min-width:110px}
#clock .day{font-size:12px;color:#ffd76e;font-weight:700}
#clock .time{font-size:20px;font-weight:900;letter-spacing:1px;margin-top:1px}
#clock .badge{margin-top:3px;font-size:9px;color:#ff9a5a;background:rgba(255,120,40,.15);
  border:1px solid rgba(255,120,40,.5);border-radius:6px;padding:1px 5px;display:none}
#money{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;background:rgba(10,5,25,.78);border:1.5px solid rgba(120,255,150,.5);
  border-radius:12px;padding:8px 14px;font-size:16px;font-weight:800;color:#9dffb4}
#inv{position:absolute;bottom:calc(200px + env(safe-area-inset-bottom));left:8px;background:rgba(10,5,25,.78);border:1.5px solid rgba(255,190,80,.35);
  border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.6;max-width:45vw}
#prompt{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:rgba(10,5,25,.9);border:2px solid #ffd76e;border-radius:12px;padding:8px 16px;
  font-size:13px;font-weight:700;color:#ffe9b8;opacity:0;transition:.2s;white-space:nowrap;max-width:90vw}
#prompt.show{opacity:1}
#toast{position:absolute;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:rgba(10,5,25,.92);border:2px solid #ff8a3d;border-radius:12px;padding:8px 16px;
  font-size:13px;font-weight:700;color:#ffd76e;opacity:0;transition:.35s;pointer-events:none;
  max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* ============ DUST WARNING ============ */
#dust{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;transition:.4s}
#dust.show{opacity:1}
#dust::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%, transparent 20%, rgba(180,140,90,.4) 100%)}
.dustMsg{position:absolute;top:28%;left:50%;transform:translate(-50%,-50%);
  background:rgba(120,40,10,.92);border:3px solid #ffb04a;border-radius:14px;padding:12px 22px;
  font-size:clamp(14px,4.5vw,20px);font-weight:900;color:#fff;text-align:center;
  box-shadow:0 0 40px rgba(255,120,40,.6);animation:pulse 1s ease-in-out infinite;max-width:90vw}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.05)}}

/* ============ DIALOG ============ */
#dialog{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.4);padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
#dialogBox{background:linear-gradient(180deg,rgba(20,8,40,.98),rgba(8,2,20,.99));
  border:2px solid #ffd76e;border-radius:16px;padding:16px 18px;
  width:100%;max-width:520px;box-shadow:0 0 60px rgba(255,180,60,.35)}
#dialogName{color:#ffd76e;font-weight:900;font-size:15px;margin-bottom:6px}
#dialogText{font-size:14px;line-height:1.8;margin-bottom:12px}
#dialogButtons{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dbtn{padding:12px 18px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
  border:2px solid rgba(255,190,80,.6);border-radius:10px;color:#ffe9b8;
  background:linear-gradient(180deg,rgba(90,20,140,.8),rgba(40,5,70,.9));transition:.15s;min-width:80px}
.dbtn:active{transform:scale(.95);background:linear-gradient(180deg,rgba(140,40,200,.9),rgba(70,10,110,1))}

/* ============ TOUCH CONTROLS ============ */
#touchUI{position:fixed;inset:0;z-index:30;pointer-events:none;display:none}
#touchUI.on{display:block}

/* Joystick */
#joy{position:absolute;left:calc(20px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));
  width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,.03));
  border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffd76e, #ff8a3d);
  border:2px solid rgba(255,255,255,.7);
  transform:translate(-50%,-50%);box-shadow:0 4px 18px rgba(255,140,60,.6)}

/* Action buttons */
#actions{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:auto}
.abtn{width:72px;height:72px;border-radius:50%;border:2.5px solid rgba(255,255,255,.55);
  background:radial-gradient(circle at 35% 30%, rgba(120,60,200,.85), rgba(50,10,90,.9));
  color:#fff;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 18px rgba(0,0,0,.5);transition:.12s;font-family:inherit;touch-action:manipulation}
.abtn:active{transform:scale(.9);border-color:#ffd76e;background:radial-gradient(circle at 35% 30%, rgba(255,180,80,.95), rgba(200,90,30,.95))}
.abtn.small{width:58px;height:58px;font-size:20px}
.abtn.run{background:radial-gradient(circle at 35% 30%, rgba(255,140,60,.85), rgba(160,50,10,.9))}
.abtn.run.active{border-color:#fff;box-shadow:0 0 22px rgba(255,180,80,.9)}

/* Rotation hint overlay */
#lookZone{position:absolute;top:0;right:0;width:55%;height:70%;pointer-events:auto;touch-action:none}
#lookHint{position:absolute;top:50%;right:12px;transform:translateY(-50%);
  color:rgba(255,255,255,.35);font-size:11px;writing-mode:vertical-rl;
  pointer-events:none;transition:.5s}
#lookHint.fade{opacity:0}

/* Landscape warning */
#rotateWarn{position:fixed;inset:0;z-index:200;background:#12002b;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:30px}
#rotateWarn .icon{font-size:60px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
#rotateWarn p{font-size:16px;color:#ffd76e;font-weight:700}
#rotateWarn small{color:#c8a8ff;font-size:13px}
@media (orientation:portrait) and (max-width:900px){
  #rotateWarn.show{display:flex}
}
</style>
</head>
<body>

<div id="menu">
  <div class="menu-inner">
    <div class="title">همه چیز بلد</div>
    <div class="subtitle">دهکده انارستان</div>
    <div class="btns">
      <button class="btn" id="btnStart">▶ شروع بازی</button>
      <button class="btn" id="btnHelp">📖 راهنما و کنترل‌ها</button>
      <button class="btn" id="btnAbout">ℹ درباره بازی</button>
    </div>
    <div class="foot">📱 نسخه موبایل • Three.js</div>
  </div>
</div>

<canvas id="c"></canvas>

<div id="hud">
  <div id="clock">
    <div class="day" id="dayLabel">شنبه</div>
    <div class="time" id="timeLabel">06:00</div>
    <div class="badge" id="dayBadge">🐐 چوپانی</div>
  </div>
  <div id="money">💰 ۰</div>
  <div id="inv"></div>
  <div id="prompt"></div>
  <div id="toast"></div>
</div>

<div id="dust"><div class="dustMsg">⚠️ برای چشمات خاک ضرر داره</div></div>

<!-- ============ TOUCH CONTROLS ============ -->
<div id="touchUI">
  <div id="lookZone"><div id="lookHint">👆 بکش تا دوربین بچرخه</div></div>
  <div id="joy"><div id="joyKnob"></div></div>
  <div id="actions">
    <button class="abtn small" id="btnRun">🏃</button>
    <button class="abtn" id="btnInteract">E</button>
  </div>
</div>

<div id="dialog" class="hidden">
  <div id="dialogBox">
    <div id="dialogName"></div>
    <div id="dialogText"></div>
    <div id="dialogButtons"></div>
  </div>
</div>

<div id="rotateWarn">
  <div class="icon">📱</div>
  <p>گوشی رو بچرخون افقی 📱↔️</p>
  <small>برای تجربه بهتر بازی، حالت افقی توصیه می‌شه</small>
  <button class="btn" style="max-width:200px;margin-top:10px" onclick="document.getElementById('rotateWarn').classList.remove('show')">ادامه در حالت عمودی</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ==========================================================================
   «همه چیز بلد» — نسخه موبایل
   ========================================================================== */

const IS_TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// ------- ثابت‌ها -------
const DAYS = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const SHEPHERD_DAYS = [0, 3, 5];
const REAL_SEC_PER_GAME_MIN = 0.5;

// ------- وضعیت -------
const state = {
  day: 0, hour: 6, minute: 0, money: 0,
  started: false, paused: true,
  mode: 'idle', hasBasket: false, basketFruit: 0, basketsDone: 0,
  sheepFollowing: false, sheepInPasture: false, waitingForNight: false,
  dialogueOpen: false
};

const player = {
  group: null, pos: new THREE.Vector3(0,0,25), rot: Math.PI,
  speed: 6, running: false, walkPhase: 0,
  arms:{l:null,r:null}, legs:{l:null,r:null},
  covering:false, coverT:0, dustT:0
};

// ==========================================================================
// صحنه
// ==========================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 60, 180);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 800);
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: !IS_TOUCH});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  checkOrientation();
});
addEventListener('orientationchange', ()=> setTimeout(checkOrientation, 200));

function checkOrientation(){
  const warn = document.getElementById('rotateWarn');
  if(innerHeight > innerWidth && innerWidth < 900 && IS_TOUCH){
    warn.classList.add('show');
  } else {
    warn.classList.remove('show');
  }
}

const hemi = new THREE.HemisphereLight(0xffffff, 0x557744, 0.75);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d0, 1.1);
sun.position.set(60, 90, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(IS_TOUCH ? 1024 : 2048, IS_TOUCH ? 1024 : 2048);
sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120; sun.shadow.camera.bottom = -120;
sun.shadow.camera.far = 300;
scene.add(sun);

const ambientNight = new THREE.AmbientLight(0x223355, 0.0);
scene.add(ambientNight);

// ==========================================================================
// دنیا
// ==========================================================================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({color:0x5fa04a, roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

function makeRoad(x,z,w,h,color=0x9a8a6a){
  const r = new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshStandardMaterial({color, roughness:1}));
  r.rotation.x = -Math.PI/2; r.position.set(x, 0.02, z); r.receiveShadow = true;
  scene.add(r);
}
makeRoad(0, 0, 12, 120);
makeRoad(0, 0, 120, 12);

function makeTree(x, z, scale=1){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,3,8),
    new THREE.MeshStandardMaterial({color:0x6b4a2b}));
  trunk.position.y = 1.5; trunk.castShadow = true; g.add(trunk);
  const foliage = new THREE.Mesh(new THREE.SphereGeometry(2.1, 12, 12),
    new THREE.MeshStandardMaterial({color:0x2f8b3a, roughness:1}));
  foliage.position.y = 4; foliage.castShadow = true; g.add(foliage);
  g.position.set(x, 0, z); g.scale.setScalar(scale);
  scene.add(g); return g;
}

const pomTrees = [];
function makePomTree(x, z){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.32,2.4,8),
    new THREE.MeshStandardMaterial({color:0x7a4a2b}));
  trunk.position.y = 1.2; trunk.castShadow = true; g.add(trunk);
  const foliage = new THREE.Mesh(new THREE.SphereGeometry(1.7, 12, 12),
    new THREE.MeshStandardMaterial({color:0x3a9c46, roughness:1}));
  foliage.position.y = 3.2; foliage.castShadow = true; g.add(foliage);

  const fruits = [];
  const fruitMat = new THREE.MeshStandardMaterial({color:0xd42b2b, roughness:.4, emissive:0x3a0000});
  for(let i=0;i<20;i++){
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), fruitMat);
    const a = Math.random()*Math.PI*2;
    const b = Math.random()*Math.PI;
    const r = 1.7;
    f.position.set(Math.sin(b)*Math.cos(a)*r, 3.2 + Math.cos(b)*r, Math.sin(b)*Math.sin(a)*r);
    f.castShadow = true; g.add(f); fruits.push(f);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  pomTrees.push({group:g, fruits, remaining:20});
}

function makeBuilding(x, z, w, h, d, color){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({color, roughness:.9}));
  body.position.y = h/2; body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*0.78, 1.6, 4),
    new THREE.MeshStandardMaterial({color:0x8a3a2a}));
  roof.position.y = h + 0.8; roof.rotation.y = Math.PI/4; roof.castShadow = true;
  g.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.15),
    new THREE.MeshStandardMaterial({color:0x3a2418}));
  door.position.set(0, 1.1, d/2 + 0.08); g.add(door);
  g.position.set(x, 0, z);
  scene.add(g);
}

// چیدمان
makeBuilding(0, 32, 8, 4, 7, 0xdcc9a8);
(function buildGarden(){
  const wallMat = new THREE.MeshStandardMaterial({color:0xb08a5a});
  const makeWall = (x,z,w,d)=>{
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,1.4,d), wallMat);
    m.position.set(x,0.7,z); m.castShadow = true; scene.add(m);
  };
  makeWall(-20, -40, 1, 30);
  makeWall( 20, -40, 1, 30);
  makeWall(0, -25, 40, 1);
  makeWall(0, -55, 40, 1);
  for(let i=0;i<5;i++) for(let j=0;j<4;j++) makePomTree(-14 + i*7, -32 - j*6);
})();

makeBuilding(45, 20, 10, 4.5, 8, 0xd8e0f0);
makeBuilding(-45, 20, 8, 4, 7, 0xf0c8d8);
makeBuilding(-45, -10, 9, 4, 7, 0xa0a8b0);
makeBuilding(-45, -35, 12, 5, 10, 0xc0a880);
makeBuilding(20, 40, 8, 4, 6, 0xf0d8a0);
makeBuilding(60, -10, 10, 4.5, 9, 0xb8483a);

const pasture = new THREE.Mesh(new THREE.CircleGeometry(22, 32),
  new THREE.MeshStandardMaterial({color:0x77c75a, roughness:1}));
pasture.rotation.x = -Math.PI/2;
pasture.position.set(70, 0.03, -45);
pasture.receiveShadow = true;
scene.add(pasture);

[[-60,50],[50,-70],[-70,-60],[80,50],[-30,60],[30,-80],[-80,0],[80,0]].forEach(([x,z])=>makeTree(x,z));

// ==========================================================================
// شخصیت سه‌بعدی (با عینک)
// ==========================================================================
function makeCharacter(opts={}){
  const {shirt=0x3a5fc8, pants=0x2a2a3a, skin=0xf0c090, glasses=true, hairColor=0x1a1a1a} = opts;
  const c = new THREE.Group();
  const skinM   = new THREE.MeshStandardMaterial({color:skin, roughness:.7});
  const shirtM  = new THREE.MeshStandardMaterial({color:shirt, roughness:.85});
  const pantsM  = new THREE.MeshStandardMaterial({color:pants, roughness:.9});
  const darkM   = new THREE.MeshStandardMaterial({color:0x111111, metalness:.5, roughness:.4});
  const lensM   = new THREE.MeshPhysicalMaterial({color:0xaaddff, transparent:true, opacity:.35, roughness:.05});
  const whiteM  = new THREE.MeshStandardMaterial({color:0xffffff});
  const pupilM  = new THREE.MeshStandardMaterial({color:0x000000});

  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.30, 0.55, 6, 12), shirtM);
  torso.position.y = 1.20; torso.castShadow = true; c.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.23, 20, 20), skinM);
  head.position.y = 1.78; head.castShadow = true; c.add(head);

  const hair = new THREE.Mesh(
    new THREE.SphereGeometry(0.245, 20, 20, 0, Math.PI*2, 0, Math.PI*0.55),
    new THREE.MeshStandardMaterial({color:hairColor, roughness:.9}));
  hair.position.y = 1.80; c.add(hair);

  [-1,1].forEach(s=>{
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8), skinM);
    ear.position.set(s*0.22, 1.78, 0); c.add(ear);
  });

  [-0.085, 0.085].forEach(x=>{
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.038, 10, 10), whiteM);
    w.position.set(x, 1.80, -0.195); c.add(w);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.019, 8, 8), pupilM);
    p.position.set(x, 1.80, -0.222); c.add(p);
  });

  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.032, 0.09, 8), skinM);
  nose.rotation.x = Math.PI/2; nose.position.set(0, 1.75, -0.235); c.add(nose);

  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.02, 0.02),
    new THREE.MeshStandardMaterial({color:0x7a2020}));
  mouth.position.set(0, 1.70, -0.225); c.add(mouth);

  if(glasses){
    [-0.085, 0.085].forEach(x=>{
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.058, 0.011, 6, 16), darkM);
      ring.position.set(x, 1.80, -0.20); c.add(ring);
      const lens = new THREE.Mesh(new THREE.CircleGeometry(0.056, 16), lensM);
      lens.position.set(x, 1.80, -0.201); c.add(lens);
    });
    const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.012, 0.012), darkM);
    bridge.position.set(0, 1.80, -0.20); c.add(bridge);
    [-1,1].forEach(s=>{

const joyEl = document.getElementById('joy');
const joyKnob = document.getElementById('joyKnob');
const lookZone = document.getElementById('lookZone');
const lookHint = document.getElementById('lookHint');

const joy = { active: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0 };
let runHeld = false;

// --- Joystick ---
function joyStart(e){
  const t = e.changedTouches ? e.changedTouches[0] : e;
  if(joy.id !== null) return;
  joy.id = t.identifier !== undefined ? t.identifier : 'mouse';
  joy.active = true;
  const rect = joyEl.getBoundingClientRect();
  joy.cx = rect.left + rect.width/2;
  joy.cy = rect.top + rect.height/2;
  joyMove(e);
  e.preventDefault();
}
function joyMove(e){
  if(!joy.active) return;
  const touches = e.changedTouches || [e];
  for(const t of touches){
    const tid = t.identifier !== undefined ? t.identifier : 'mouse';
    if(tid !== joy.id) continue;
    const dx = t.clientX - joy.cx;
    const dy = t.clientY - joy.cy;
    const maxR = 45;
    const d = Math.hypot(dx, dy);
    const cl = Math.min(1, d/maxR);
    const ang = Math.atan2(dy, dx);
    const kx = Math.cos(ang) * cl * maxR;
    const ky = Math.sin(ang) * cl * maxR;
    joyKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
    joy.dx = Math.cos(ang) * cl;
    joy.dy = Math.sin(ang) * cl;
  }
  e.preventDefault();
}
function joyEnd(e){
  if(!joy.active) return;
  const touches = e.changedTouches || [e];
  for(const t of touches){
    const tid = t.identifier !== undefined ? t.identifier : 'mouse';
    if(tid === joy.id){
      joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
      joyKnob.style.transform = 'translate(-50%,-50%)';
    }
  }
}

joyEl.addEventListener('touchstart', joyStart, {passive:false});
joyEl.addEventListener('touchmove', joyMove, {passive:false});
joyEl.addEventListener('touchend', joyEnd);
joyEl.addEventListener('touchcancel', joyEnd);
joyEl.addEventListener('mousedown', joyStart);
addEventListener('mousemove', joyMove);
addEventListener('mouseup', joyEnd);

// --- چرخش دوربین با کشیدن ---
const look = { active: false, id: null, lastX: 0, lastY: 0 };
function lookStart(e){
  const t = e.changedTouches ? e.changedTouches[0] : e;
  if(look.id !== null) return;
  look.id = t.identifier !== undefined ? t.identifier : 'mouse';
  look.active = true;
  look.lastX = t.clientX;
  look.lastY = t.clientY;
  lookHint.classList.add('fade');
  e.preventDefault();
}
function lookMove(e){
  if(!look.active) return;
  const touches = e.changedTouches || [e];
  for(const t of touches){
    const tid = t.identifier !== undefined ? t.identifier : 'mouse';
    if(tid !== look.id) continue;
    const dx = t.clientX - look.lastX;
    // فقط چرخش افقی (چپ/راست) → حرکت joystick افقی رو دست نمی‌گیریم
    player.rot -= dx * 0.008;
    look.lastX = t.clientX;
    look.lastY = t.clientY;
  }
  e.preventDefault();
}
function lookEnd(e){
  if(!look.active) return;
  const touches = e.changedTouches || [e];
  for(const t of touches){
    const tid = t.identifier !== undefined ? t.identifier : 'mouse';
    if(tid === look.id){ look.active = false; look.id = null; }
  }
}

lookZone.addEventListener('touchstart', lookStart, {passive:false});
lookZone.addEventListener('touchmove', lookMove, {passive:false});
lookZone.addEventListener('touchend', lookEnd);

const dustZones = [{x:-45, z:-35, r:14}];
const dustParticles = (()=>{
  const geo = new THREE.BufferGeometry();
  const N = 300;
  const pos = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]   = -45 + (Math.random()-0.5)*30;
    pos[i*3+1] = Math.random()*4;
    pos[i*3+2] = -35 + (Math.random()-0.5)*30;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({color:0xd8b878, size:0.25, transparent:true, opacity:0.55, depthWrite:false});
  const p = new THREE.Points(geo, mat);
  scene.add(p);
  return p;
})();
const dustEl = document.getElementById('dust');

function updateDust(dt){
  let inDust = false;
  for(const z of dustZones){
    const dx = player.pos.x - z.x, dz = player.pos.z - z.z;
    if(dx*dx + dz*dz < z.r*z.r){ inDust = true; break; }
  }
  if(inDust) player.dustT = Math.min(1, player.dustT + dt*2);
  else player.dustT = Math.max(0, player.dustT - dt*1.5);
  player.covering = player.dustT > 0.35;
  dustEl.classList.toggle('show', player.dustT > 0.35);
  dustParticles.rotation.y += dt * 0.15;
}

// ==========================================================================
// حلقه بازی
// ==========================================================================
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3();

function updatePlayer(dt){
  if(state.dialogueOpen) return;

  const running = runHeld || keys['shift'];
  const speed = player.speed * (running ? 1.85 : 1);

  // چرخش با کیبورد (دسکتاپ)
  if(keys['a'] || keys['arrowleft']) player.rot += 2.4*dt;
  if(keys['d'] || keys['arrowright']) player.rot -= 2.4*dt;

  // حرکت با joystick + کیبورد
  let mx = 0, my = 0;
  if(joy.active){ mx = joy.dx; my = -joy.dy; } // dy منفی چون صفحه
  if(keys['w'] || keys['arrowup']) my = 1;
  if(keys['s'] || keys['arrowdown']) my = -1;

  let moved = false;
  if(Math.abs(mx) > 0.05 || Math.abs(my) > 0.05){
    // حرکت نسبی به جهت بازیکن
    const forward = new THREE.Vector3(-Math.sin(player.rot), 0, -Math.cos(player.rot));
    const right   = new THREE.Vector3(Math.cos(player.rot), 0, -Math.sin(player.rot));
    const moveVec = new THREE.Vector3()
      .addScaledVector(forward, my)
      .addScaledVector(right, mx);
    if(moveVec.length() > 0.05){
      moveVec.normalize();
      player.pos.addScaledVector(moveVec, speed*dt);
      moved = true;
    }
  }

  player.pos.x = Math.max(-90, Math.min(90, player.pos.x));
  player.pos.z = Math.max(-90, Math.min(90, player.pos.z));
  player.running = running && moved;

  // ریختن انار
  if(player.running && state.hasBasket && state.basketFruit > 0){
    player._dropAcc = (player._dropAcc || 0) + dt;
    if(player._dropAcc > 1.2){
      player._dropAcc = 0;
      state.basketFruit = Math.max(0, state.basketFruit - 1);
      showToast('🍎 یه انار افتاد! آروم‌تر برو');
      updateHUD();
    }
  }

  // انیمیشن راه رفتن
  if(moved){
    player.walkPhase += dt * (player.running ? 14 : 9);
    const swing = Math.sin(player.walkPhase) * (player.running ? 0.9 : 0.55);
    player.legs.l.rotation.x =  swing;
    player.legs.r.rotation.x = -swing;
    if(!player.covering){
      player.arms.l.rotation.x = -swing * 0.7;
      player.arms.r.rotation.x =  swing * 0.7;
      player.arms.l.rotation.z = 0;
      player.arms.r.rotation.z = 0;
    }
  } else {
    player.walkPhase *= 0.85;
    player.legs.l.rotation.x *= 0.85;
    player.legs.r.rotation.x *= 0.85;
    if(!player.covering){
      player.arms.l.rotation.x *= 0.85;
      player.arms.r.rotation.x *= 0.85;
    }
  }

  // پوشاندن صورت
  const targetT = player.covering ? 1 : 0;
  player.coverT += (targetT - player.coverT) * Math.min(1, dt*6);
  const cT = player.coverT;
  player.arms.r.rotation.x = -cT * 2.6;
  player.arms.r.rotation.z =  cT * 0.6;
  player.arms.l.rotation.x = -cT * 2.2;
  player.arms.l.rotation.z = -cT * 0.5;
  player.group.userData.head.rotation.x = cT * 0.35;

  player.group.position.copy(player.pos);
  player.group.rotation.y = player.rot;
}

function updateCamera(dt){
  const back = new THREE.Vector3(Math.sin(player.rot), 0, Math.cos(player.rot));
  // فاصله دوربین بر اساس اندازه صفحه
  const dist = Math.max(5.5, Math.min(7, innerWidth/140));
  const desired = player.pos.clone()
    .addScaledVector(back, dist)
    .add(new THREE.Vector3(0, dist*0.55 + 1.2, 0));
  camera.position.lerp(desired, Math.min(1, dt*4));
  camTarget.copy(player.pos).add(new THREE.Vector3(0, 1.5, 0));
  camera.lookAt(camTarget);
}

function updateInteractPrompt(){
  if(state.dialogueOpen){ promptEl.classList.remove('show'); return; }
  let best = null, bestD = Infinity;
  for(const it of interactables){
    const dx = player.pos.x - it.x, dz = player.pos.z - it.z;
    const d = Math.hypot(dx, dz);
    if(d < it.r && d < bestD){ best = it; bestD = d; }
  }
  currentInteract = best;
  if(best){ promptEl.textContent = '👉 ' + best.label + ' (دکمه E)'; promptEl.classList.add('show'); }
  else promptEl.classList.remove('show');
}

function updateSheep(dt){
  if(!state.sheepFollowing) return;
  sheep.forEach((s, i)=>{
    const target = player.pos.clone().add(new THREE.Vector3(
      Math.cos(i*1.1)*3.2, 0, Math.sin(i*1.1)*3.2));
    const dir = target.clone().sub(s.group.position);
    const d = dir.length();
    if(d > 0.5){
      dir.normalize();
      s.group.position.addScaledVector(dir, Math.min(d, 3.0*dt));
      s.group.rotation.y = Math.atan2(dir.x, dir.z) + Math.PI;
    }
  });

  const dxp = player.pos.x - 70, dzp = player.pos.z + 45;
  if(!state.sheepInPasture && dxp*dxp + dzp*dzp < 24*24){
    state.sheepInPasture = true;
    showToast('🐑 گله رسید به چراگاه!');
  }

  if(state.sheepInPasture && state.hour >= 19 && !state.waitingForNight){
    state.waitingForNight = true;
    showToast('🌙 غروب شد — گله رو برگردون!');
  }

  const dxb = player.pos.x - 60, dzb = player.pos.z + 10;
  if(state.waitingForNight && dxb*dxb + dzb*dzb < 6*6){
    state.mode = 'idle';
    state.sheepFollowing = false;
    state.sheepInPasture = false;
    state.waitingForNight = false;
    state.money += 700;
    showToast('✅ گله برگشت — +۷۰۰');
    updateHUD();
  }
}

function updateLighting(){
  const h = state.hour + state.minute/60;
  let sunI = 0, ambI = 0;
  if(h >= 6 && h < 8){ sunI = (h-6)/2 * 1.1; ambI = 0.3 * (h-6)/2; }
  else if(h >= 8 && h < 17){ sunI = 1.1; ambI = 0.3; }
  else if(h >= 17 && h < 20){ sunI = 1.1 * (1 - (h-17)/3); ambI = 0.3 * (1 - (h-17)/3); }
  else { sunI = 0.05; ambI = 0; }

  sun.intensity = sunI;
  ambientNight.intensity = 0.35 * (1 - Math.min(1, sunI));
  hemi.intensity = 0.15 + 0.6 * Math.min(1, sunI);

  const dayCol = new THREE.Color(0x87ceeb);
  const sunsetCol = new THREE.Color(0xff9966);
  const nightCol = new THREE.Color(0x0a1024);
  let sky;
  if(h >= 5 && h < 7) sky = nightCol.clone().lerp(sunsetCol, (h-5)/2);
  else if(h >= 7 && h < 17) sky = sunsetCol.clone().lerp(dayCol, Math.min(1,(h-7)/3));
  else if(h >= 17 && h < 19) sky = dayCol.clone().lerp(sunsetCol, (h-17)/2);
  else if(h >= 19 && h < 21) sky = sunsetCol.clone().lerp(nightCol, (h-19)/2);
  else sky = nightCol;
  scene.background = sky;
  scene.fog.color = sky;

  const ang = ((h - 6) / 24) * Math.PI * 2;
  sun.position.set(Math.cos(ang)*80, Math.max(10, Math.sin(ang)*90), 40);
}

let lastHudUpdate = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  if(state.started && !state.paused){
    timeAccum += dt;
    while(timeAccum >= REAL_SEC_PER_GAME_MIN){
      timeAccum -= REAL_SEC_PER_GAME_MIN;
      advanceTime(1);
    }
    updatePlayer(dt);
    updateSheep(dt);
    updateDust(dt);
    updateCamera(dt);
    updateInteractPrompt();
    updateLighting();

    lastHudUpdate += dt;
    if(lastHudUpdate > 0.25){ lastHudUpdate = 0; updateHUD(); }
  }

  renderer.render(scene, camera);
}
animate();
